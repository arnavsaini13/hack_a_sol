[project]
name = "agri-transparency-backend"
version = "0.1.0"
description = "Agricultural Policy, Loan & Subsidy Transparency Platform - Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "python-multipart>=0.0.6",
    "rapidfuzz>=3.5.0",
    "weasyprint>=60.0",
    "jinja2>=3.1.2",
    "slowapi>=0.1.9",
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "apscheduler>=3.10.0",
    "httpx>=0.25.0",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "indic-transliteration>=2.3.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

